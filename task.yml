id: "remove"
name: "Remove files"
description: "Remove files"
inputs:
  inputs:
    description: "Files and directories (globs) to remove"
    type: "array"
    items: "string"
  input:
    description: "Deprecated, use 'inputs'"
    type: "array"
    items: "string"
  force:
    description: "Ignore nonexistent files and arguments"
    type: boolean
    default: false
  recursive:
    description: "Whether to recursively remove all subdirectories"
    type: boolean
    default: false
  include-hidden:
    description: "Also match hidden files and directories (starting with a '.') with wildcards such as '*' and '**'"
    type: boolean
    default: false
outputs:
  files:
    description: Matched globs that have been removed
    type: array
    items: string
runs:
  using: "python"
  main: "prepare_remove/main.py"