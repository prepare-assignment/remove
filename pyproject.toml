[project]
name = "prepare-remove"
version = "0.1.0"
description = "Remove action"
authors = [{ name = "Bonajo", email = "m.bonajo@fontys.nl" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prepare-toolbox>=1.0.1",
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.11.1",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.1",
    "packaging>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["prepare_remove"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
